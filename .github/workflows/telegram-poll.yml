name: FEMI lightweight Telegram polling
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-femi-telegram-poll
  cancel-in-progress: false
jobs:
  poll:
    if: ${{ vars.FEMI_PUBLIC_ACTIVE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PRIVATE_REPO_DISPATCH_TOKEN: ${{ secrets.PRIVATE_REPO_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight HTTP client
        run: pip install requests
      - name: Check Telegram and wake private production only if needed
        run: python -u poll.py
